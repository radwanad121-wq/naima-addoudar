name: build
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pillow numpy "rembg[cpu]"
      - run: |
          mkdir -p w/raw && base64 -d pk.txt > w/pk.tgz && cd w && tar xzf pk.tgz
          for f in 3-4 4-5 1-6 2-3 2-5 3-6 6-3 7-3 8-3; do curl -sSL -A Mozilla/5.0 -o raw/$f.png https://edmarker.com/wp-content/uploads/2021/07/$f.png; done
          python proc.py && python build2.py out pimg
          mkdir -p site && cp -r out/${{ github.event.repository.name }}/. site/ && cp pimg_sheet.jpg site/ && touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with: {github_token: '${{ secrets.GITHUB_TOKEN }}', publish_dir: w/site, force_orphan: true}
